name: HSK6 SC042-048 Android emulator QA

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  scene-smoke:
    if: github.head_ref == 'review/hsk6-sc042-sc048-compose-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare offline Mandarin recognition model
        run: bash tools/prepare_vosk_cn_model.sh
      - name: Build QA debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Launch SC042/048 and capture stage screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p qa-screens
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            for scene in 042 048; do
              for speaker in zhang li; do
                for mode in compact expanded; do
                  expanded=false
                  if [ "$mode" = expanded ]; then expanded=true; fi
                  adb shell am force-stop com.uysal23.newchinese || true
                  adb shell am start -n com.uysal23.newchinese/.ui.Hsk6ReviewProbeActivity --es scene "$scene" --es speaker "$speaker" --ez expanded "$expanded"
                  sleep 3
                  adb shell pidof com.uysal23.newchinese > /dev/null
                  adb exec-out screencap -p > "qa-screens/sc${scene}_${speaker}_${mode}.png"
                  test -s "qa-screens/sc${scene}_${speaker}_${mode}.png"
                done
              done
            done
            adb logcat -d > qa-screens/logcat.txt
            if grep -F "Process: com.uysal23.newchinese" qa-screens/logcat.txt; then
              echo "App crashed during Android scene runtime QA"
              exit 1
            fi
            sha256sum qa-screens/*.png > qa-screens/screenshots.sha256
      - name: Upload QA screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk6-sc042-sc048-emulator-screenshots
          path: qa-screens/
          if-no-files-found: warn
